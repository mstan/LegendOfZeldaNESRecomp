format_version = 1
id = "legend-of-zelda.enhancement.voxel-diorama"
version = "1.0.0"
name = "Voxel 3D (overworld)"
author = "NESRecomp"
description = "Renders Zelda's live playfield as a depth-buffered 3D diorama without changing the stock ROM or save data."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "legend-of-zelda-us"
rom_crc32 = "3fe272fb"

[[feature]]
id = "voxel-diorama"
name = "Voxel 3D (overworld)"
camera_controls = true
description = "Extrudes live map tiles, presents OAM sprites as upright cards, and extends the black HUD bar across the widescreen frame."
group = "Display"
default_enabled = false
exclusive_group = "display-mode"

[[plugin]]
feature = "voxel-diorama"
id = "legend-of-zelda.voxel-diorama"

[[option]]
feature = "voxel-diorama"
id = "pitch"
label = "Camera pitch"
description = "Vertical camera angle in degrees."
group = "Camera"
type = "integer"
default = 35
min = 5
max = 85
step = 5

[[option]]
feature = "voxel-diorama"
id = "yaw"
label = "Camera yaw"
description = "Horizontal orbit around the playfield in degrees."
group = "Camera"
type = "integer"
default = -20
min = -180
max = 180
step = 5

[[option]]
feature = "voxel-diorama"
id = "roll"
label = "Camera roll"
description = "Rotation around the view axis in degrees."
group = "Camera"
type = "integer"
default = 0
min = -45
max = 45
step = 5

[[option]]
feature = "voxel-diorama"
id = "zoom"
label = "Zoom"
description = "Camera zoom percentage."
group = "Camera"
type = "integer"
default = 100
min = 50
max = 200
step = 5

[[option]]
feature = "voxel-diorama"
id = "sprite-scale"
label = "Sprite scale"
description = "Scale of assembled Link, enemy, and item billboards."
group = "Sprites"
type = "integer"
default = 135
min = 75
max = 250
step = 5
