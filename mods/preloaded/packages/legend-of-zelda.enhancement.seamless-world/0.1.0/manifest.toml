format_version = 1
id = "legend-of-zelda.enhancement.seamless-world"
version = "0.1.0"
name = "Seamless Overworld"
author = "NESRecomp"
description = "Follow Link continuously across ordinary room boundaries, with neighboring terrain and live actors visible ahead. The view fits the window and expands when resized. Local play."
license = "MIT"
resolver = "declarative"
save_compatibility = "seamless-world-preview"

[[target]]
game_id = "legend-of-zelda-us"
rom_crc32 = "3fe272fb"

[[feature]]
id = "seamless-world"
name = "Seamless Overworld"
experimental = true
description = "A continuous camera with neighboring terrain and live actors, including connected dungeon rooms. Fits the window as it resizes. Mouse wheel changes zoom; F4 shows the whole map. Caves, stairs and maze puzzles keep their portal routing. Requires the original stock program; select Redux to use its native viewport or compatible HD graphics instead. Cross-room enemy/projectile interactions are incomplete; full-map simulation is slower. Local play only."
group = "Camera"
default_enabled = true
exclusive_group = "display-mode"
exclusive_groups = ["stock-program-renderer"]

[[plugin]]
feature = "seamless-world"
id = "legend-of-zelda.seamless-world"

[[option]]
feature = "seamless-world"
id = "pixel-zoom"
label = "Pixel zoom"
description = "Larger pixels show less world. Resizing the window always adjusts the visible area to fit. The mouse wheel changes this during play."
group = "Camera"
type = "integer"
default = 3
min = 1
max = 8
step = 1

[[option]]
feature = "seamless-world"
id = "stopwatch-scope"
label = "Stopwatch scope"
description = "Choose where the stopwatch freezes enemies. Current viewport and Current room keep the area captured at pickup, even after Link moves or the window is resized."
group = "Gameplay"
type = "choice"
default = "entire-map"

[[option.choice]]
value = "entire-map"
label = "Entire map"

[[option.choice]]
value = "current-viewport"
label = "Current viewport"

[[option.choice]]
value = "current-room"
label = "Current room"
