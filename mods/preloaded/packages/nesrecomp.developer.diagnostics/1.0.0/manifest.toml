format_version = 1
id = "nesrecomp.developer.diagnostics"
version = "1.0.0"
name = "Startup and Crash Diagnostics"
author = "NESRecomp"
description = "Records startup, host settings, renderer, session progress and errors for bug reports. On Windows, unhandled crashes also create a small minidump. Files stay on your computer."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "legend-of-zelda-us"
rom_crc32 = "3fe272fb"

# SimpleDanny/Snarfblam translation + font mod ("Relocalized") image. Its
# executable code layout matches the retail image - every [[mod_function_hook]]
# declared in config/cycle/game-cycle-relocalized.toml matches at codegen time -
# but the cartridge data differs, so the image carries its own identity.
[[target]]
game_id = "legend-of-zelda-us"
rom_crc32 = "397b56a6"

# Another USA dump of the same program revision (payload CRC32 c452304e).
# Diagnostics only reads the host: it has no cartridge assumptions.
[[target]]
game_id = "legend-of-zelda-us"
rom_crc32 = "c452304e"

[[feature]]
id = "diagnostics"
name = "Startup and Crash Diagnostics"
description = "Enable before PLAY, reproduce the problem, then share the newest .log and any matching .dmp from the diagnostics folder beside the program. Disable after testing. Logs and dumps may contain local paths and process information; review before sharing."
group = "Developer"
default_enabled = false

[[plugin]]
feature = "diagnostics"
id = "nesrecomp.diagnostics"
